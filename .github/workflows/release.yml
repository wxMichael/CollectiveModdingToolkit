name: Build and Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      upload_to_nexus:
        description: Upload to Nexus Mods
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Get version
        id: version
        shell: bash
        run: |
          v=$(sed -n 's:.*<FileVersion>\(.*\)</FileVersion>.*:\1:p' CollectiveModdingToolkit/CollectiveModdingToolkit.csproj | head -n1)
          if [ -z "$v" ]; then
            echo "::error::FileVersion not found in csproj"
            exit 1
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::FileVersion '$v' must be two numbers (FEATURE.FIX, e.g. 1.0)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check version is unused
        if: github.ref_type == 'tag' || inputs.upload_to_nexus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match csproj FileVersion 'v$VERSION'"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for version 'v$VERSION' already exists"
            exit 1
          fi

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^\[[^]]+\]: / { if (found) exit }
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | awk '{ sub(/\r$/, "") } NF { started = 1; while (b-- > 0) print ""; b = 0; print; next } started { b++ }' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version '$VERSION'"
            exit 1
          fi
          cat release-notes.md

      - name: Restore
        run: dotnet restore CollectiveModdingToolkit.sln

      - name: Check third-party notices are current
        run: dotnet run --file tools/GenerateThirdPartyNotices.cs -- --check

      - name: Test
        run: dotnet test CollectiveModdingToolkit.Tests -c Release --no-restore

      - name: Publish
        run: dotnet publish CollectiveModdingToolkit/CollectiveModdingToolkit.csproj -c Release --no-restore -o publish

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb, publish/*.config -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item publish staging/CM-Toolkit -Recurse
          Compress-Archive -Path staging/CM-Toolkit -DestinationPath cm-toolkit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cm-toolkit
          path: cm-toolkit.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cm-toolkit

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" cm-toolkit.zip \
            --repo "$REPO" \
            --title "Collective Modding Toolkit $TAG" \
            --notes-file release-notes.md

  nexus:
    if: github.ref_type == 'tag' || inputs.upload_to_nexus
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: cm-toolkit

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Build Nexus changelog
        id: changelog
        run: |
          {
            echo "text<<EOF_CHANGELOG"
            python3 .github/scripts/nexus_changelog.py release-notes.md
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          changelog: ${{ steps.changelog.outputs.text }}
          filename: cm-toolkit.zip
          version: ${{ needs.build.outputs.version }}
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          display_name: Collective Modding Toolkit
